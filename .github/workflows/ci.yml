name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python ML environment
        run: bash scripts/setup-ml-env.sh

      - name: Run full validation suite (Build, Lint, Vitest, Mypy, Ruff)
        run: npm run validate

      - name: Check dist output
        run: |
          test -f dist/cli.js || { echo "Missing dist/cli.js"; exit 1; }
          test -f dist/index.js || { echo "Missing dist/index.js"; exit 1; }
          echo "dist/ contents:"
          ls -la dist/
          echo "---"
          echo "Total dist size:"
          du -sh dist/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
