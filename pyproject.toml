[project]
name = "crypto-radar-ml"
version = "0.1.0"
description = "Crypto Radar ML pipeline (Python side)"
requires-python = ">=3.14"

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["__pycache__/", "ml/models/", ".venv-ml/"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=ml --cov-report=term-missing --tb=short"
